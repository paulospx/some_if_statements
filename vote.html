    .section-head {

    .sort-label select {

    .sprint-cards { display: none; gap: 10px; }
    .sprint-card {

    .sprint-meta { display: flex; flex-wrap: wrap; gap: 10px 16px; margin-top: 8px; font-weight: 650; }

      .nav .fac { display: none; }
      .topbar { align-items: flex-start; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>

        id = (crypto.randomUUID && crypto.randomUUID()) || ("d" + Date.now() + Math.random().toString(16).slice(2));
        localStorage.setItem(LS_DEVICE, id);
      }
      return id;
    }
    function nowIso() { return new Date().toISOString(); }
    function fmtTime(iso) {
      try { return new Date(iso).toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" }); }
      catch { return ""; }
    }
    function makeCode() {
      let out = "";
      const buf = new Uint32Array(6);
      crypto.getRandomValues(buf);
      for (let i = 0; i < 6; i++) out += CODE_CHARS[buf[i] % CODE_CHARS.length];
      return out;
    }
    function normalizeCode(raw) {
      return String(raw || "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 6);
    }
    function getConfig() {
      try {
        const saved = JSON.parse(localStorage.getItem(LS_CONFIG) || "null");
        if (saved && saved.apiKey && saved.projectId) {
          if (!saved.databaseURL && FIREBASE_CONFIG.databaseURL) {
            saved.databaseURL = FIREBASE_CONFIG.databaseURL;
          }
          return saved;
        }
      } catch (_) {}
      if (FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.projectId) return FIREBASE_CONFIG;
      return null;
    }
    function firebaseReady() { return !!db; }
    function hostedList() {
      try { return JSON.parse(localStorage.getItem(LS_HOSTED) || "[]"); }
      catch { return []; }
    }
    function rememberHosted(sprint) {
      const list = hostedList().filter((s) => s.code !== sprint.code);
      list.unshift({ code: sprint.code, title: sprint.title, createdAt: sprint.createdAt });
      localStorage.setItem(LS_HOSTED, JSON.stringify(list.slice(0, 20)));
    }
    function toast(msg) {
      const el = $("toast");
      el.textContent = msg;
      el.hidden = false;
      clearTimeout(toast._t);
      toast._t = setTimeout(() => { el.hidden = true; }, 2400);
    }

    function localGetSprint(code) {
      const all = JSON.parse(localStorage.getItem(LS_SPRINTS) || "{}");
      return all[code] || null;
    }
    function localSaveSprint(sprint) {
      const all = JSON.parse(localStorage.getItem(LS_SPRINTS) || "{}");
      all[sprint.code] = sprint;
      localStorage.setItem(LS_SPRINTS, JSON.stringify(all));
    }
    function localVotes(code) {
      return JSON.parse(localStorage.getItem(LS_VOTES + code) || "{}");
    }
    function localSaveVote(code, id, vote) {
      const all = localVotes(code);
      all[id] = vote;
      localStorage.setItem(LS_VOTES + code, JSON.stringify(all));
      if (channel) channel.postMessage({ type: "votes", code });
    }

    function initFirebase() {
      const cfg = getConfig();
      db = null;
      if (!cfg) return false;
      try {
        if (!firebase.apps.length) firebase.initializeApp(cfg);
        else firebase.app();
        db = firebase.database();
        return true;
      } catch (err) {
        console.warn(err);
        db = null;
        return false;
      }
    }

    async function createSprint(data) {
      const sprint = {
        code: makeCode(),
        title: data.title.trim(),
        description: data.description.trim(),
        goal: data.goal.trim(),
        status: "open",
        createdAt: nowIso()
      };
      if (db) {
        try {
          await db.ref("sprints/" + sprint.code).set(sprint);
        } catch (err) {
          console.warn("Firebase create failed, using local store", err);
        }
      }
      localSaveSprint(sprint);
      rememberHosted(sprint);
      return sprint;
    }

    async function fetchSprint(code) {
      if (db) {
        const snap = await db.ref("sprints/" + code).once("value");
        if (snap.exists()) {
          const sprint = snap.val();
          localSaveSprint(sprint);
          return sprint;
        }
      }
      return localGetSprint(code);
    }

    async function saveVote(code, vote) {
      const payload = {
        happiness: vote.happiness,
        confidence: vote.confidence,
        comment: (vote.comment || "").trim(),
        displayName: (vote.displayName || "").trim(),
        updatedAt: nowIso()
      };
      if (db) {
        try {
          await db.ref("votes/" + code + "/" + deviceId()).set(payload);
        } catch (err) {
          console.warn("Firebase vote failed, using local store", err);
        }
      }
      localSaveVote(code, deviceId(), payload);
    }

    function stopListening() {
      if (state.unsub) { state.unsub(); state.unsub = null; }
      state.listening = null;
    }

    function localAllSprints() {
      try { return JSON.parse(localStorage.getItem(LS_SPRINTS) || "{}"); }
      catch { return {}; }
    }
    function localAllVotes(sprints) {
      const votes = {};
      const codes = new Set(Object.keys(sprints || {}));
      hostedList().forEach((s) => codes.add(s.code));
      codes.forEach((code) => { votes[code] = localVotes(code); });
      return votes;
    }

    function listenVotes(code) {
      if (state.listening === "votes:" + code) return;
      stopListening();
      state.listening = "votes:" + code;
      const apply = (map) => {
        const next = Object.values(map).sort((a, b) => (a.updatedAt || "").localeCompare(b.updatedAt || ""));
        const prevCount = state.votes.length;
        state.votes = next;
        if (state.view === "results" || state.view === "share") render();
        if (next.length > prevCount && prevCount > 0) toast("New vote in");
      };
      if (db) {
        const ref = db.ref("votes/" + code);
        const onVal = (snap) => apply(snap.val() || {});
        const onErr = (err) => {
          state.notice = "Live updates paused: " + err.message;
          apply(localVotes(code));
        };
        ref.on("value", onVal, onErr);
        state.unsub = () => ref.off("value", onVal);
        return;
      }
      apply(localVotes(code));
      const onMsg = (e) => { if (e.data && e.data.code === code) apply(localVotes(code)); };
      if (channel) channel.addEventListener("message", onMsg);
      const onStorage = (e) => { if (e.key === LS_VOTES + code) apply(localVotes(code)); };
      window.addEventListener("storage", onStorage);
      state.unsub = () => {
        if (channel) channel.removeEventListener("message", onMsg);
        window.removeEventListener("storage", onStorage);
      };
    }

    function listenGlobal() {
      if (state.listening === "global") return;
      stopListening();
      state.listening = "global";
      state.globalReady = false;
      const paint = () => { if (state.view === "global") render(); };
      if (db) {
        const sprintsRef = db.ref("sprints");
        const votesRef = db.ref("votes");
        let gotS = false, gotV = false;
        const ready = () => {
          if (gotS && gotV) {
            state.globalReady = true;
            paint();
          }
        };
        const onSprints = (snap) => { state.allSprints = snap.val() || {}; gotS = true; ready(); };
        const onVotes = (snap) => {
          const prev = flattenVotes(state.allVotes).length;
          state.allVotes = snap.val() || {};
          gotV = true;
          ready();
          const next = flattenVotes(state.allVotes).length;
          if (next > prev && prev > 0 && state.view === "global") toast("New vote in");
        };
        const onErr = (err) => {
          state.notice = "Live updates paused: " + err.message;
          state.allSprints = localAllSprints();
          state.allVotes = localAllVotes(state.allSprints);
          state.globalReady = true;
          paint();
        };
        sprintsRef.on("value", onSprints, onErr);
        votesRef.on("value", onVotes, onErr);
        state.unsub = () => {
          sprintsRef.off("value", onSprints);
          votesRef.off("value", onVotes);
        };
        return;
      }
      state.allSprints = localAllSprints();
      state.allVotes = localAllVotes(state.allSprints);
      state.globalReady = true;
      const refresh = () => {
        state.allSprints = localAllSprints();
        state.allVotes = localAllVotes(state.allSprints);
        paint();
      };
      const onMsg = (e) => { if (e.data && e.data.type === "votes") refresh(); };
      if (channel) channel.addEventListener("message", onMsg);
      const onStorage = (e) => {
        if (e.key === LS_SPRINTS || (e.key && e.key.indexOf(LS_VOTES) === 0)) refresh();
      };
      window.addEventListener("storage", onStorage);
      state.unsub = () => {
        if (channel) channel.removeEventListener("message", onMsg);
        window.removeEventListener("storage", onStorage);
      };
    }

    function flattenVotes(allVotes) {
      const rows = [];
      const sprints = state.allSprints || {};
      Object.keys(allVotes || {}).forEach((code) => {
        const map = allVotes[code] || {};
        Object.values(map).forEach((v) => {
          if (!v || v.happiness == null || v.confidence == null) return;
          const sprint = sprints[code] || {};
          rows.push({
            ...v,
            code,
            title: sprint.title || code
          });
        });
      });
      return rows;
    }

    function avg(key) { return avgOf(state.votes, key); }
    function dist(key) { return distOf(state.votes, key); }
    function avgOf(votes, key) {
      if (!votes.length) return null;
      const sum = votes.reduce((a, v) => a + Number(v[key] || 0), 0);
      return sum / votes.length;
    }
    function distOf(votes, key) {
      const d = [0, 0, 0, 0, 0, 0];
      votes.forEach((v) => { d[Number(v[key])] = (d[Number(v[key])] || 0) + 1; });
      return d;
    }
    function summarize(votes, key) {
      const nums = votes.map((v) => Number(v[key])).filter((n) => Number.isFinite(n));
      if (!nums.length) return null;
      const sorted = nums.slice().sort((a, b) => a - b);
      const mean = nums.reduce((a, n) => a + n, 0) / nums.length;
      const mid = Math.floor(sorted.length / 2);
      const median = sorted.length % 2 ? sorted[mid] : (sorted[mid - 1] + sorted[mid]) / 2;
      const variance = nums.reduce((a, n) => a + (n - mean) ** 2, 0) / nums.length;
      return {
        n: nums.length,
        mean,
        median,
        stdev: Math.sqrt(variance),
        low: nums.filter((n) => n <= 2).length,
        mid: nums.filter((n) => n === 3).length,
        high: nums.filter((n) => n >= 4).length
      };
    }
    function fmtAvg(n) { return n == null ? "—" : n.toFixed(1); }
    function pct(part, whole) { return whole ? Math.round((part / whole) * 100) : 0; }
    function wordFor(key, value) {
      if (value == null) return "Waiting";
      const list = key === "happiness" ? HAPPY : CONF;
      return list[Math.round(value)].word;
    }

    function parseHash() {
      const h = (location.hash || "#/").replace(/^#/, "");
      const parts = h.split("/").filter(Boolean);
      if (!parts.length) return { view: "home" };
      if (parts[0] === "create") return { view: "create" };
      if (parts[0] === "settings") return { view: "settings" };
      if (parts[0] === "global") return { view: "global" };
      if ((parts[0] === "s" || parts[0] === "v" || parts[0] === "r") && parts[1]) {
        const map = { s: "share", v: "vote", r: "results" };
        return { view: map[parts[0]], code: normalizeCode(parts[1]) };
      }
      return { view: "home" };
    }

    function go(path) {
      if (location.hash !== "#" + path) location.hash = path;
      else onRoute();
    }

    async function onRoute() {
      const route = parseHash();
      state.view = route.view;
      state.error = "";
      state.showJoin = false;
      if (route.code && route.code !== state.code) {
        state.code = route.code;
        state.step = 0;
        state.draft = { displayName: "", happiness: null, confidence: null, comment: "" };
        state.sprint = null;
        state.votes = [];
      }
      if (!route.code) {
        state.code = "";
        state.sprint = null;
        if (route.view === "global") listenGlobal();
        else stopListening();
      }
      if (route.code) {
        try {
          const sprint = await fetchSprint(route.code);
          if (!sprint) {
            stopListening();
            state.error = "That join code was not found. Check the six characters on the screen.";
            state.view = "home";
          } else {
            state.sprint = sprint;
            listenVotes(route.code);
            const mine = localVotes(route.code)[deviceId()];
            if (mine && mine.happiness != null && mine.confidence != null) {
              state.draft = {
                displayName: mine.displayName || "",
                happiness: mine.happiness,
                confidence: mine.confidence,
                comment: mine.comment || ""
              };
              if (state.view === "vote" && state.step === 0) state.step = 4;
            }
          }
        } catch (err) {
          state.error = err.message || "Could not load this sprint.";
        }
      }
      render();
    }

      return `

    function bindVoteStep() {
      if (state.step === 0) {
        // Setup handlers for the name / animal picker so selection syncs to the text field
        const setupNameHandlers = () => {
          const nameInput = $("displayName");
          const animalSelect = $("animalSelect");
          const randBtn = $("randAnimal");
          if (animalSelect) {
            animalSelect.onchange = () => {
              if (animalSelect.value === "__custom__") {
                nameInput.focus();
              } else {
                nameInput.value = animalSelect.value;
              }
            };
          }
          if (randBtn) {
            randBtn.onclick = () => {
              const a = ANIMALS[Math.floor(Math.random() * ANIMALS.length)];
              if (a) {
                nameInput.value = a.name;
                if (animalSelect) animalSelect.value = a.name;
              }
            };
          }
        };

        $("next").onclick = () => {
          state.draft.displayName = $("displayName").value.trim();
          state.step = 1; render();
        };
        // ensure handlers attach after render
        setTimeout(setupNameHandlers, 0);
      }
      if (state.step === 1 || state.step === 2) {
        const key = state.step === 1 ? "happiness" : "confidence";
        document.querySelectorAll(".scale-opt").forEach((btn) => {
          btn.onclick = () => {
            state.draft[key] = Number(btn.dataset.v);
            render();
          };
        });
        $("back").onclick = () => { state.step -= 1; render(); };
        $("next").onclick = () => {
          if (state.draft[key] === null) return;
          state.step += 1; render();
        };
        window.onkeydown = (e) => {
          if (e.key >= "0" && e.key <= "5") {
            state.draft[key] = Number(e.key);
            render();
          }
        };
      } else {
        window.onkeydown = null;
      }
      if (state.step === 3) {
        const area = $("comment");
        const tick = () => { $("commentCount").textContent = `${area.value.length} / 400`; };
        area.addEventListener("input", tick); tick();
        $("back").onclick = () => { state.draft.comment = area.value; state.step = 2; render(); };
        $("next").onclick = async () => {
          state.draft.comment = area.value;
          const btn = $("next");
          btn.disabled = true; btn.textContent = "Sending…";
          try {
            await saveVote(state.code, state.draft);
            state.step = 4;
            render();
          } catch (err) {
            toast(err.message || "Could not save vote");
            btn.disabled = false; btn.textContent = "Send my vote";
          }
        };
      }
    }

    function meterSvg(value) {
      const max = 5;
      const v = value == null ? 0 : value;
      const r = 36, c = 2 * Math.PI * r;
      const dash = (v / max) * c;
      const color = COLORS[Math.round(v)] || COLORS[0];
      return `<svg class="meter" viewBox="0 0 88 88" aria-hidden="true">
        <circle cx="44" cy="44" r="${r}" fill="none" stroke="currentColor" opacity=".12" stroke-width="8"/>
        <circle cx="44" cy="44" r="${r}" fill="none" stroke="${color}" stroke-width="8"
          stroke-linecap="round" stroke-dasharray="${dash} ${c}" transform="rotate(-90 44 44)"/>
      </svg>`;
    }

    function bars(key, votes) {
      const list = votes || state.votes;
      const labels = key === "happiness" ? HAPPY : CONF;
      const d = distOf(list, key);
      const max = Math.max(1, ...d);
      return `<div class="bars">${d.map((n, i) => `
        <div class="bar-row">
          <span title="${labels[i].word}">${labels[i].face} ${i}</span>
          <div class="track"><div class="fill" style="width:${(n / max) * 100}%;background:${COLORS[i]}"></div></div>
          <span>${n}</span>
        </div>`).join("")}</div>`;
    }

    function sprintSummaries() {
      const byCode = { ...(state.allSprints || {}) };
      Object.keys(state.allVotes || {}).forEach((code) => {
        if (!byCode[code]) byCode[code] = { code, title: "Untitled sprint", createdAt: "", goal: "", description: "" };

      return Object.values(byCode).map((s) => {
        const votes = Object.values((state.allVotes || {})[s.code] || {}).filter((v) => v && v.happiness != null && v.confidence != null);
        return {
          code: s.code,
          title: s.title || s.code,
          createdAt: s.createdAt || "",
          goal: s.goal || "",
          voteCount: votes.length,
          h: avgOf(votes, "happiness"),
          c: avgOf(votes, "confidence"),
          comments: votes.filter((v) => (v.comment || "").trim()).length
        };
      });
    }

    function sortSummaries(list) {
      const copy = list.slice();
      const key = state.globalSort;
      copy.sort((a, b) => {
        if (key === "votes") return b.voteCount - a.voteCount;
        if (key === "happiness") return (a.h ?? 99) - (b.h ?? 99);
        if (key === "confidence") return (a.c ?? 99) - (b.c ?? 99);
        return (b.createdAt || "").localeCompare(a.createdAt || "");
      });
      return copy;
    }

    function globalInsight(rows, hStat, cStat) {
      if (!rows.length) return "No votes yet. As soon as someone submits, this page fills in.";
      const h = hStat.mean;
      const c = cStat.mean;
      const bits = [];
      if (h >= 4 && c >= 4) bits.push("The team is in a strong place — high energy and high confidence.");
      else if (h < 3 && c < 3) bits.push("Both mood and confidence are low. Start there before adding more work.");
      else if (h >= 3.5 && c < 3) bits.push("People feel alright, but confidence in the goal is the weaker signal.");
      else if (c >= 3.5 && h < 3) bits.push("Belief in the goal is higher than how the team feels right now.");
      else bits.push(`Overall pulse is mid-range: happiness ${h.toFixed(1)} and confidence ${c.toFixed(1)} out of 5.`);
      const spread = Math.max(hStat.stdev, cStat.stdev);
      if (rows.length >= 4 && spread >= 1.2) bits.push("Scores are spread out — the average hides disagreement.");
      else if (rows.length >= 4 && spread <= 0.7) bits.push("People are clustered close together.");
      return bits.join(" ");
    }

    function alignmentLabel(stat) {
      if (!stat) return "No scores yet";
      if (stat.n < 3) return "Need a few more votes to judge agreement";
      if (stat.stdev <= 0.7) return "Tight — people agree";
      if (stat.stdev <= 1.2) return "Some spread";
      return "Wide — averages hide disagreement";
    }

    function mixBar(stat, labels) {
      if (!stat) return `<p class="muted">Waiting for the first vote.</p>`;
      const segs = [
        { n: stat.low, color: "#E11D48", label: labels.low },
        { n: stat.mid, color: "#EAB308", label: labels.mid },
        { n: stat.high, color: "#22C55E", label: labels.high }
      ];
      return `
        <div class="mix-bar" aria-hidden="true">${segs.map((s) => s.n ? `<span class="mix-seg" style="flex:${s.n};background:${s.color}"></span>` : "").join("")}</div>
        <div class="mix-legend">${segs.map((s) => `<span><i style="background:${s.color}"></i>${esc(s.label)} · ${s.n} (${pct(s.n, stat.n)}%)</span>`).join("")}</div>`;
    }

        <div class="shell">
          ${topbar()}
          <form class="panel form" id="cfgForm">
            <p class="kicker">Connect Firebase</p>
            <h1 class="display" style="font-size:2.3rem;margin:12px 0 8px">Same project, every phone</h1>
            <p class="lede" style="margin-left:0">Paste the web app config from Firebase. Better still, put it in the FIREBASE_CONFIG block at the top of this file so the whole team shares one backend.</p>
            ${firebaseReady() ? `<div class="banner ok">Connected to project ${esc(cfg.projectId)}.</div>` : `<div class="banner warn">No project yet — voting still works in local mode on this browser.</div>`}
            <div class="field">
              <label class="label" for="cfgJson">Firebase config JSON</label>
              <textarea id="cfgJson" style="min-height:220px;font-family:ui-monospace,monospace;font-size:.85rem">${esc(JSON.stringify({
                apiKey: cfg.apiKey || "",
                authDomain: cfg.authDomain || "",
                databaseURL: cfg.databaseURL || "",
                projectId: cfg.projectId || "",
                storageBucket: cfg.storageBucket || "",
                messagingSenderId: cfg.messagingSenderId || "",
                appId: cfg.appId || ""
              }, null, 2))}</textarea>
            </div>
            <button class="btn btn-primary" type="submit">Save and connect</button>
            <p class="hint" style="margin-top:18px">
              1. Create a Firebase project and enable Realtime Database (test mode is fine for a team room).<br>
              2. Project settings → Your apps → Web → copy the config object, including <code>databaseURL</code>.<br>
              3. Deploy the rules from <code>database.rules.json</code> in this folder.
            </p>
          </form>
        </div>`;
      $("cfgForm").onsubmit = (e) => {
        e.preventDefault();
        try {
          const parsed = JSON.parse($("cfgJson").value);
          if (!parsed.apiKey || !parsed.projectId) throw new Error("apiKey and projectId are required");
          if (!parsed.databaseURL) throw new Error("databaseURL is required for Realtime Database");
          localStorage.setItem(LS_CONFIG, JSON.stringify(parsed));
          location.reload();
        } catch (err) {
          toast(err.message || "Could not parse JSON");
        }
      };
    }

    function readCodeInputs() {
      return [0,1,2,3,4,5].map((i) => ($("c" + i) || {}).value || "").join("").toUpperCase();
    }
    function wireCodeInputs(preset) {
      const boxes = [0,1,2,3,4,5].map((i) => $("c" + i));
      if (preset) {
        normalizeCode(preset).split("").forEach((ch, i) => { if (boxes[i]) boxes[i].value = ch; });
      }
      boxes.forEach((box, i) => {
        box.addEventListener("input", (e) => {
          const clean = normalizeCode(e.target.value);
          if (clean.length > 1) {
            clean.split("").forEach((ch, idx) => { if (boxes[idx]) boxes[idx].value = ch; });
            boxes[Math.min(clean.length, 5)].focus();
            return;
          }
          box.value = clean;
          if (clean && boxes[i + 1]) boxes[i + 1].focus();
        });
        box.addEventListener("keydown", (e) => {
          if (e.key === "Backspace" && !box.value && boxes[i - 1]) boxes[i - 1].focus();
          if (e.key === "Enter") $("joinBtn").click();
        });
        box.addEventListener("paste", (e) => {
          e.preventDefault();
          const clean = normalizeCode((e.clipboardData || window.clipboardData).getData("text"));
          clean.split("").forEach((ch, idx) => { if (boxes[idx]) boxes[idx].value = ch; });
          boxes[Math.min(clean.length, 5)].focus();
        });
      });
      boxes[0].focus();
    }

    function render() {
      if (state.view === "vote" && state.step === 4) { renderThanks(); return; }
      const views = {
        home: renderHome,
        create: renderCreate,
        share: renderShare,
        vote: renderVote,
        results: renderResults,
        global: renderGlobal,
        settings: renderSettings
      };
      (views[state.view] || renderHome)();
    }

    window.addEventListener("hashchange", onRoute);
    initFirebase();
    onRoute();
  </script>
</body>
</html>
